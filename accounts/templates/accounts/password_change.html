{% extends "project/base.html" %}

{% block title %}Cambiar contraseña | Mi Blog{% endblock %}

{% block content %}
  <section class="form-card narrow-card">
    <span class="eyebrow">Seguridad</span>
    <h1>Cambiar contraseña</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button type="submit">Cambiar contraseña</button>
        <a class="button button-secondary" href="{% url 'perfil' %}">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
